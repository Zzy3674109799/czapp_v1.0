server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    types {
        text/html html htm;
        text/css css;
        text/javascript js jsx;
        application/manifest+json webmanifest;
        application/javascript mjs;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
